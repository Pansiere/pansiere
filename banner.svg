<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <!-- Fundo degradê colorido (dark + vibrante) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0B0F14"/>
      <stop offset="35%" stop-color="#141B2D"/>
      <stop offset="65%" stop-color="#0D2A3A"/>
      <stop offset="100%" stop-color="#2B0F2A"/>
    </linearGradient>

    <!-- Brilhos suaves coloridos (bem discretos) -->
    <radialGradient id="glow1" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#F97316" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Vinheta para deixar "meio darker" -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Sombra suave no texto -->
    <filter id="softShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Glows minimalistas -->
  <rect width="1280" height="320" fill="url(#glow1)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- “Grão” leve (pontos bem sutis) -->
  <g opacity="0.08">
    <circle cx="140" cy="70" r="1.2" fill="#ffffff"/>
    <circle cx="260" cy="210" r="1.0" fill="#ffffff"/>
    <circle cx="410" cy="120" r="0.9" fill="#ffffff"/>
    <circle cx="640" cy="80" r="1.1" fill="#ffffff"/>
    <circle cx="820" cy="190" r="0.8" fill="#ffffff"/>
    <circle cx="1020" cy="110" r="1.0" fill="#ffffff"/>
    <circle cx="1160" cy="240" r="0.9" fill="#ffffff"/>
  </g>

  <!-- Vinheta -->
  <rect width="1280" height="320" fill="url(#vignette)"/>

  <!-- Linha/Accent minimalista -->
  <rect x="160" y="210" width="140" height="3" rx="2" fill="#22C55E" opacity="0.9"/>

  <!-- Texto -->
  <text x="160" y="190"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial"
        font-size="64"
        font-weight="700"
        letter-spacing="-1"
        fill="#22C55E"
        filter="url(#softShadow)">
    I sometimes code
  </text>
</svg>
