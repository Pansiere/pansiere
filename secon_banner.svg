<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

    <!-- ================= DEFINIÇÕES ================= -->
    <defs>
        <!-- Fundo tech -->
        <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#052e2b"/>
        </linearGradient>

        <!-- Gradiente neon -->
        <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>

        <!-- Glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- ================= FUNDO ================= -->
    <rect width="1200" height="320" fill="url(#bgTech)" rx="18"/>

    <!-- ================= LINHAS TECNOLÓGICAS ================= -->
    <g stroke="#10b981" stroke-opacity="0.15">
        <line x1="0" y1="260" x2="1200" y2="260"/>
        <line x1="0" y1="220" x2="1200" y2="220"/>
        <line x1="0" y1="180" x2="1200" y2="180"/>
    </g>

    <!-- ================= GRÁFICO FINANCEIRO ================= -->
    <polyline
        points="750,240 820,210 890,230 960,170 1030,190 1100,140"
        fill="none"
        stroke="url(#neonGreen)"
        stroke-width="4"
        filter="url(#glow)"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Pontos do gráfico -->
    <g fill="#34d399" filter="url(#glow)">
        <circle cx="750" cy="240" r="5"/>
        <circle cx="820" cy="210" r="5"/>
        <circle cx="890" cy="230" r="5"/>
        <circle cx="960" cy="170" r="5"/>
        <circle cx="1030" cy="190" r="5"/>
        <circle cx="1100" cy="140" r="5"/>
    </g>

    <!-- ================= LOGO ================= -->
    <g transform="translate(120,160) scale(3)">

        <circle cx="0" cy="0" r="30" fill="url(#neonGreen)" filter="url(#glow)"/>

        <path
            d="M0 -18C0 -18 -8 -14 -8 -6C-8 2 0 6 0 6"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
        />
        <path
            d="M0 -6C0 -6 8 -2 8 6C8 14 0 18 0 18"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
        />

        <line
            x1="0"
            y1="-22"
            x2="0"
            y2="22"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
        />
    </g>

    <!-- ================= TEXTOS ================= -->
    <text x="330" y="145"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="76"
          font-weight="700"
          fill="white"
          letter-spacing="6">
        SECON
    </text>

    <text x="330" y="190"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="24"
          fill="#86efac"
          letter-spacing="2">
        Sistema de Economia e Controle Financeiro
    </text>

    <text x="330" y="235"
          font-family="Consolas, monospace"
          font-size="20"
          fill="url(#neonGreen)"
          filter="url(#glow)"
          opacity="0.9"
          letter-spacing="2">
        I sometimes code.
    </text>
</svg>
